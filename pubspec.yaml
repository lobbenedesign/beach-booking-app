name: beach_booking
description: Customer-facing booking app for beach clubs and their restaurants — browse, book, and pay for umbrellas, tables, and extras.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  
  # Navigation
  go_router: ^12.0.0
  
  # Utilities
  intl: ^0.18.0
  google_fonts: ^6.1.0
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  share_plus: ^10.1.2
  flutter_credit_card: ^4.1.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  mask_text_input_formatter: ^2.9.0

  # SVG rendering for the superadmin-replaceable map element library
  flutter_svg: ^2.0.10+1
  file_picker: ^11.0.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
